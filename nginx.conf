# Define global event settings (often required even if left empty)
events {}

http {
  # Define an upstream group named 'api_upstream' with one backend server
  upstream api_upstream {
    server api:80;  # Points to the 'api' service on port 80 (Docker internal networking)
  }

  server {
    listen 8080;  # Listen for incoming HTTP requests on port 8080

    location / {
      proxy_pass http://api_upstream;  # Forward all traffic to the upstream backend
    }
  }
}


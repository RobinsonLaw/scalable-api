version: "3.8"
services:
  api:
    build: .
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:latest
    restart:  unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
